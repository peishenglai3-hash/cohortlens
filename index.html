    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Engineering Bible §42: no leading-slash absolute asset paths.
      Vite rewrites the base for this file automatically when VITE_BASE is set, so the relative
      references below stay correct both at the site root and under /repo-name/.
      The web manifest itself is generated by vite-plugin-pwa from application.json.
    -->
    <meta name="theme-color" content="#3b5b7a" />
    <meta
      name="description"
      content="本地优先的结构化测评工具：整理参与者已主动表达的信息，不代替人做吸纳或排除决定。"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CohortLens" />
    <title>CohortLens</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
