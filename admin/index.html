<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>CohortLens 审阅台</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --surface: #ffffff;
        --border: #d8dde5;
        --text: #1f2933;
        --muted: #5b6b7c;
        --accent: #3b5b7a;
        --accent-soft: #e8eef5;
        --warn: #fff8e6;
        --warn-border: #e8cf8a;
        --alarm: #fdf2f2;
        --alarm-border: #e4a8a8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        font-size: 15px;
        line-height: 1.6;
      }
      h1,
      h2,
      h3 {
        line-height: 1.3;
      }
      a {
        color: var(--accent);
      }
      .shell {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 16px 60px;
      }
      .topbar {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
        margin-bottom: 20px;
      }
      .topbar h1 {
        font-size: 1.25rem;
        margin: 0;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .hint {
        color: var(--muted);
        font-size: 0.88rem;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 160px;
      }
      label {
        font-size: 0.85rem;
        color: var(--muted);
      }
      input,
      select,
      textarea {
        font: inherit;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
      }
      textarea {
        min-height: 72px;
        resize: vertical;
      }
      button {
        font: inherit;
        padding: 9px 14px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
      }
      button.secondary {
        background: #fff;
        color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .linklike {
        background: none;
        border: none;
        color: var(--accent);
        padding: 0;
        text-decoration: underline;
        cursor: pointer;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }
      th,
      td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-weight: 600;
        white-space: nowrap;
      }
      tbody tr:hover {
        background: var(--accent-soft);
      }
      .badge {
        display: inline-block;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0 8px;
        font-size: 0.8rem;
        white-space: nowrap;
      }
      .badge-undecided {
        background: #fff;
      }
      .badge-shortlisted {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .badge-needs_more_info {
        background: var(--warn);
        border-color: var(--warn-border);
      }
      .badge-not_this_round {
        background: var(--alarm);
        border-color: var(--alarm-border);
      }
      .notice {
        background: var(--warn);
        border: 1px solid var(--warn-border);
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 0.9rem;
      }
      .boundary {
        background: var(--accent-soft);
        border-left: 4px solid var(--accent);
        padding: 10px 12px;
        border-radius: 4px;
        font-size: 0.9rem;
      }
      .meter {
        height: 8px;
        background: #e3e7ee;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 4px;
      }
      .meter > div {
        height: 100%;
        background: var(--accent);
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 12px;
      }
      .stat {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
      }
      .stat b {
        font-variant-numeric: tabular-nums;
      }
      ul.tight {
        margin: 6px 0;
        padding-left: 1.2em;
      }
      ul.tight li {
        margin-bottom: 4px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85rem;
      }
      pre.raw {
        background: #0f1720;
        color: #d8e2ee;
        padding: 12px;
        border-radius: 6px;
        overflow: auto;
        max-height: 420px;
        font-size: 0.8rem;
      }
      .error {
        background: var(--alarm);
        border: 1px solid var(--alarm-border);
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 12px;
      }
      @media (max-width: 640px) {
        th:nth-child(3),
        td:nth-child(3) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="admin-root"></div>
    <script type="module" src="./entry.tsx"></script>
  </body>
</html>
